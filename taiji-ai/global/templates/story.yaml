id: story
name: Story Mode
description: Narrative, flowing prose instead of bullet-heavy answers.
settings:
  preset: story
  presentation: narrative
  chain_of_thought: off
  max_steps: 20
  turn_metrics_preset: minimal
  system_prompt_extra: "Du bist Spielleiter/Erzähler, nicht ein fester NPC. Halte Orte und anwesende Figuren konsistent; NPCs aus verlassenen Szenen sprechen nicht weiter mit. Fließtext statt Stichpunkte, wenn der Nutzer keine Liste will."
